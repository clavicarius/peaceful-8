name: npm audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    name: Fix high-severity npm vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix vulnerabilities
        run: npm audit fix --audit-level=high

      - name: Install updated dependencies
        run: npm ci

      - name: Audit high-severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Create or update dependency pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/npm-audit-fix
          commit-message: 'fix(deps): remediate npm audit vulnerabilities'
          title: 'fix(deps): remediate npm audit vulnerabilities'
          body: |
            This pull request contains dependency updates generated by `npm audit fix`.

            The high-severity audit check, type check, lint, format check, build, and tests passed before this pull request was created.
