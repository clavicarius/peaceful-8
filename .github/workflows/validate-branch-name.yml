name: Validate Branch Name

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    # Dependabot generates its own branch names (e.g. dependabot/npm_and_yarn/...)
    # that cannot follow the naming policy, so exempt PRs authored by the bot.
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout ci-platform validator
        uses: actions/checkout@v4
        with:
          repository: clavicarius/ci-platform
          ref: v1
          path: .ci-platform

      - name: Prepare ci-platform validator script
        run: |
          mkdir -p scripts
          cp .ci-platform/scripts/validate-branch-name.sh scripts/validate-branch-name.sh

      - name: Validate source branch name
        if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
        uses: clavicarius/ci-platform/actions/validate-branch-name@v1
        with:
          branch-name: ${{ github.head_ref }}
          branch-regex: '^((feature|enhancement|bugfix|hotfix|release|chore|copilot)/[a-z0-9._-]+|dependabot(/[a-z0-9._-]+)+)$'
