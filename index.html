<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f1e8" />
    <title>Peaceful 8</title>
    <style>
      :root {
        color: #2a2118;
        background: #f7f1e8;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-content: center;
        text-align: center;
      }

      img {
        display: block;
        width: min(80vw, 24rem);
        height: auto;
        margin: 0 auto 1.5rem;
      }

      p {
        margin: 0;
        font-size: clamp(1.25rem, 4vw, 2rem);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./assets/logo.png" alt="Peaceful 8" />
      <p>Eight pieces. Zero conflicts.</p>
    </main>
  </body>
</html>
